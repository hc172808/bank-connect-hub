<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Virtual Bank - Secure Digital Banking Services</title>
    <meta name="description" content="Experience modern virtual banking with secure digital wallet, instant payments, and comprehensive financial services. Manage your money anytime, anywhere." />
    <meta name="author" content="Virtual Bank" />
    <meta name="keywords" content="virtual banking, digital wallet, mobile banking, online payments, financial services" />

    <meta property="og:title" content="Virtual Bank - Secure Digital Banking Services" />
    <meta property="og:description" content="Experience modern virtual banking with secure digital wallet, instant payments, and comprehensive financial services." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0B1B3F" />

    <meta name="twitter:card" content="summary_large_image" />

    <!-- Runtime environment config (injected by docker/generate-env.sh at container start) -->
    <!-- In development this file doesn't exist; the app falls back to import.meta.env -->
    <script src="/env-config.js" onerror="console.info('env-config.js not found — using build-time env vars (dev mode)')"></script>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Virtual Bank" />
    <meta name="mobile-web-app-capable" content="yes" />

    <style>
      #app-splash {
        position: fixed; inset: 0; z-index: 2147483647;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px; background: #0B1B3F; color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        transition: opacity .35s ease; opacity: 1;
      }
      #app-splash.hide { opacity: 0; pointer-events: none; }
      #app-splash .logo {
        width: 72px; height: 72px; border-radius: 18px;
        background: #F5C518; color: #0B1B3F;
        display: flex; align-items: center; justify-content: center;
        font-weight: 900; font-size: 34px; box-shadow: 0 10px 30px rgba(0,0,0,.35);
      }
      #app-splash .brand { font-weight: 800; letter-spacing: .12em; font-size: 15px; }
      #app-splash .spinner {
        width: 34px; height: 34px; border-radius: 50%;
        border: 3px solid rgba(255,255,255,.2); border-top-color: #F5C518;
        animation: appsplash-spin .9s linear infinite;
      }
      #app-splash .status { font-size: 13px; opacity: .75; }
      #app-splash .retry {
        display: none; margin-top: 8px; padding: 10px 18px;
        background: #F5C518; color: #0B1B3F; border: 0; border-radius: 10px;
        font-weight: 700; font-size: 14px; cursor: pointer;
      }
      #app-splash.stuck .spinner { display: none; }
      #app-splash.stuck .retry { display: inline-block; }
      #app-splash.stuck .status { color: #ffd8d8; }
      @keyframes appsplash-spin { to { transform: rotate(360deg); } }
      #app-splash .net {
        display: flex; align-items: center; gap: 8px;
        font-size: 12px; opacity: .8; letter-spacing: .02em;
      }
      #app-splash .net .dot {
        width: 9px; height: 9px; border-radius: 50%;
        background: #4ade80; box-shadow: 0 0 0 0 rgba(74,222,128,.6);
        animation: appsplash-pulse 1.8s ease-out infinite;
      }
      #app-splash.offline .net .dot { background: #f87171; box-shadow: 0 0 0 0 rgba(248,113,113,.6); }
      #app-splash .step { font-size: 11px; opacity: .55; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      @keyframes appsplash-pulse {
        0% { box-shadow: 0 0 0 0 rgba(255,255,255,.35); }
        70% { box-shadow: 0 0 0 8px rgba(255,255,255,0); }
        100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <div id="app-splash" role="status" aria-live="polite">
      <div class="logo">N</div>
      <div class="brand">NETLIFE CASH</div>
      <div class="spinner"></div>
      <div class="status" id="app-splash-status">Starting secure session…</div>
      <div class="net"><span class="dot"></span><span id="app-splash-net">Online</span></div>
      <div class="step" id="app-splash-step"></div>
      <button class="retry" id="app-splash-retry" type="button">Reload app</button>
    </div>
    <script>
      (function () {
        var splash = document.getElementById('app-splash');
        var status = document.getElementById('app-splash-status');
        var retry = document.getElementById('app-splash-retry');
        var netEl = document.getElementById('app-splash-net');
        var stepEl = document.getElementById('app-splash-step');
        if (!splash) return;

        // ── Persisted bootstrap progress ──────────────────────────────
        var ATTEMPTS_KEY = 'nlc_boot_attempts';
        var STEP_KEY = 'nlc_boot_step';
        var TS_KEY = 'nlc_boot_last_attempt';
        var LOG_KEY = 'nlc_boot_log';
        var RETRY_AT_KEY = 'nlc_boot_retry_at';
        var BACKOFF_KEY = 'nlc_boot_backoff_step';
        var FIRST_KEY = 'nlc_boot_first_seen';
        function ls(fn, d) { try { return fn(); } catch (_) { return d; } }
        var attempts = ls(function () { return parseInt(localStorage.getItem(ATTEMPTS_KEY) || '0', 10) || 0; }, 0);
        var lastStep = ls(function () { return localStorage.getItem(STEP_KEY); }, null);
        function bootLog(name, detail) {
          try {
            var arr = JSON.parse(localStorage.getItem(LOG_KEY) || '[]');
            if (!Array.isArray(arr)) arr = [];
            arr.push({ t: Date.now(), step: name, detail: detail });
            localStorage.setItem(LOG_KEY, JSON.stringify(arr.slice(-60)));
            if (!localStorage.getItem(FIRST_KEY)) localStorage.setItem(FIRST_KEY, String(Date.now()));
          } catch (_) {}
        }
        window.__bootLog = bootLog;
        window.__bootStep = function (name, detail) {
          try { localStorage.setItem(STEP_KEY, name); } catch (_) {}
          bootLog(name, detail);
          if (stepEl) stepEl.textContent = 'step: ' + name;
        };
        window.__bootStep('html-splash');
        if (attempts > 0 && lastStep) {
          if (stepEl) stepEl.textContent = 'resuming after retry #' + attempts + ' (last step: ' + lastStep + ')';
        }

        function backoffStep() {
          return ls(function () { return parseInt(localStorage.getItem(BACKOFF_KEY) || '0', 10) || 0; }, 0);
        }
        function backoffDelay(step) { return Math.min(2000 * Math.pow(2, step), 60000); }
        function reloadNow() {
          try {
            localStorage.setItem(ATTEMPTS_KEY, String(attempts + 1));
            localStorage.setItem(TS_KEY, String(Date.now()));
            localStorage.setItem(BACKOFF_KEY, String(backoffStep() + 1));
            localStorage.removeItem(RETRY_AT_KEY);
          } catch (_) {}
          bootLog('retry-reload');
          try { location.reload(); } catch (_) { location.href = location.href; }
        }

        // ── Live network indicator ────────────────────────────────────
        function paintNet() {
          var on = navigator.onLine;
          splash.classList.toggle('offline', !on);
          if (netEl) netEl.textContent = on ? 'Online — connected' : 'Offline — waiting for connectivity';
        }
        paintNet();
        window.addEventListener('online', paintNet);
        window.addEventListener('offline', paintNet);

        retry.addEventListener('click', function () {
          reloadNow();
        });

        // Stuck detector — if React hasn't rendered in 15s, show retry.
        var stuckTimer = setTimeout(function () {
          if (!splash.classList.contains('hide')) {
            splash.classList.add('stuck');
            status.textContent = navigator.onLine
              ? "Taking longer than usual. Check your connection and try again."
              : "You're offline. We'll retry automatically once you reconnect.";
            scheduleRetry();
          }
        }, 15000);

        // ── Exponential-backoff auto-retry with visible countdown ─────
        var countdownTimer = null;
        function cancelRetry() { if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; } }
        function scheduleRetry() {
          if (splash.classList.contains('hide') || !splash.classList.contains('stuck')) return;
          cancelRetry();
          if (!navigator.onLine) {
            status.textContent = "Offline — retry will start automatically once you reconnect.";
            return;
          }
          // Persisted deadline: after an auto-retry reload we resume the exact
          // remaining wait instead of restarting the countdown.
          var retryAt = ls(function () { return parseInt(localStorage.getItem(RETRY_AT_KEY) || '0', 10) || 0; }, 0);
          if (!retryAt || retryAt <= Date.now()) {
            retryAt = Date.now() + backoffDelay(backoffStep());
            try { localStorage.setItem(RETRY_AT_KEY, String(retryAt)); } catch (_) {}
          }
          function tick() {
            if (!navigator.onLine) { cancelRetry(); scheduleRetry(); return; }
            var remaining = Math.ceil((retryAt - Date.now()) / 1000);
            if (remaining <= 0) { cancelRetry(); reloadNow(); return; }
            status.textContent = "Reconnecting automatically in " + remaining + "s… (attempt " + (attempts + 1) + ")";
          }
          tick();
          countdownTimer = setInterval(tick, 500);
        }
        window.addEventListener('online', function () { if (splash.classList.contains('stuck')) scheduleRetry(); });
        window.addEventListener('offline', function () { cancelRetry(); if (splash.classList.contains('stuck')) scheduleRetry(); });

        // Update copy at 5s to reassure the user something's happening.
        var slowTimer = setTimeout(function () {
          if (!splash.classList.contains('hide')) {
            status.textContent = "Still loading — hang tight…";
          }
        }, 5000);

        // Watch for React to mount content into #root.
        var root = document.getElementById('root');
        function hide() {
          clearTimeout(stuckTimer); clearTimeout(slowTimer); cancelRetry();
          try {
            localStorage.removeItem(ATTEMPTS_KEY); localStorage.removeItem(STEP_KEY);
            localStorage.removeItem(RETRY_AT_KEY); localStorage.removeItem(BACKOFF_KEY);
            localStorage.removeItem(LOG_KEY); localStorage.removeItem(FIRST_KEY);
          } catch (_) {}
          splash.classList.add('hide');
          setTimeout(function () { splash.remove(); }, 400);
        }
        window.__hideAppSplash = hide;

        if (root && 'MutationObserver' in window) {
          var obs = new MutationObserver(function () {
            if (root.childElementCount > 0) { obs.disconnect(); hide(); }
          });
          obs.observe(root, { childList: true });
        } else {
          // Fallback poll
          var poll = setInterval(function () {
            if (root && root.childElementCount > 0) { clearInterval(poll); hide(); }
          }, 200);
        }

        // If the JS bundle fails to load at all, surface it early.
        window.addEventListener('error', function (e) {
          if (e && e.target && e.target.tagName === 'SCRIPT') {
            splash.classList.add('stuck');
            status.textContent = "Couldn't load the app. Please reload.";
            scheduleRetry();
          }
        }, true);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ("serviceWorker" in navigator && location.protocol === "https:") {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
